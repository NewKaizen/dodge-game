# Render (render.com): New → Blueprint → este repositório. Sobe o servidor do
# modo ONLINE no plano grátis (docs/online.md).
services:
  - type: web
    name: dodge-game
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /saude
    envVars:
      - key: NODE_VERSION
        value: 22
      # TURN (opcional, para quem o STUN não resolve): preencha no painel
      - key: TURN_URL
        sync: false
      - key: TURN_USUARIO
        sync: false
      - key: TURN_SENHA
        sync: false
      # Contas (login Google, perfil, foto): docs/supabase.md. Opcionais; a
      # SECRET_KEY é secreta e fica só no servidor (os nomes antigos
      # SUPABASE_ANON_KEY/SUPABASE_SERVICE_ROLE_KEY também valem)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
